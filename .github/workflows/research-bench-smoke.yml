name: Research bench smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --release

      - name: Build research binaries
        run: |
          cargo build --release -p lonecli --bin lonecli
          cargo build --release -p lonecli --bin research_trace
          cargo build --release -p lonecli --bin belief_validate
          cargo build --release -p lonecli --bin belief_bench

      - name: Python syntax checks
        run: |
          python -m py_compile python/policy_value_net.py python/klondike_env.py research/benchmark.py

      - name: Build PyO3 wheel
        run: |
          python -m pip install --upgrade pip maturin
          cd python/lonelybot_py
          maturin build --release -i python
